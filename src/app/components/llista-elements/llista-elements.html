<div class="calendar-elements-list" aria-live="polite">
    @for (elem of elements; track elem.id)
    {
        <app-targeta-element [element-calendar]="elem" (element-clicked)="onElementClicked($event)"></app-targeta-element>
    } @empty {
        <p class="empty-message">No hi ha elements per mostrar.</p>
    }
</div>
