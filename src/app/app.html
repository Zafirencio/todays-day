<main class="main-container">
  <header>
    <h1>Today's Day</h1>
    <div style="text-align: center; margin-bottom: 1.5rem; color: #ef4444; font-weight: bold; font-size: 1.1rem;">
      Tens {{ preferitsService.totalPreferits() }} esdeveniments preferits
    </div>
    <nav class="menu-navegacio">
      <a routerLink="/calendari" routerLinkActive="actiu">Calendari</a>
      <a routerLink="/cerca" routerLinkActive="actiu">Cerca</a>
      <a routerLink="/preferits" routerLinkActive="actiu">Preferits</a>
      @if (authService.obtenirUsuari() | async; as usuari) {
        <span style="display: flex; align-items: center; gap: 10px; padding: 0.5rem 1rem; background: #dcfce7; font-weight: bold; color: #166534;">
          Benvingut, {{ usuari.nom }}
          <button (click)="onLogout()" style="background: none; border: none; color: #b91c1c; font-weight: bold; cursor: pointer; padding: 0;">
            Tancar Sessió
          </button>
        </span>
      } @else {
        <a routerLink="/login" routerLinkActive="actiu">Login</a>
      }
    </nav>
  </header>
  <hr style="margin: 2rem 0; border: 1px solid #e2e8f0;">

  <router-outlet></router-outlet>

</main>
