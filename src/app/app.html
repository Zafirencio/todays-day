<main class="main-container">
  <h1>Today's Day</h1>

  <div style="text-align: center; margin-bottom: 1.5rem; color: #ef4444; font-weight: bold; font-size: 1.1rem;">
    Tens {{ preferitsService.totalPreferits() }} esdeveniments preferits
  </div>

  <app-barra-cerca (searchTerm)="filterCalendar($event)"></app-barra-cerca>
  
  <app-preferits-panel></app-preferits-panel>

  <hr style="margin: 2rem 0; border: 1px solid #e2e8f0;">
  
  @if (elementService.carregant()) {
    <div class="loading-container">
      <div class="spinner"></div> <p>Carregant el calendari...</p>
    </div>
  }

  @else if (elementService.error()) {
    <div class="error-box">
      <p> {{ elementService.error() }}</p>
      <button (click)="elementService.obtenirPopulars()">Reintentar</button>
    </div>
  }

  @else {
    <app-llista-elements [elements]="elementService.elements()"></app-llista-elements>
  }
</main>
